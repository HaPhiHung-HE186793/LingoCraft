name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # Node version pinned to match .nvmrc
  NODE_VERSION: '22'
  # pnpm version pinned to match packageManager field
  PNPM_VERSION: '9.15.4'

jobs:
  # ─── Lint + Typecheck ──────────────────────────────────────────────────
  lint-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all packages
        run: pnpm typecheck

      - name: Lint all packages
        run: pnpm lint

  # ─── Unit Tests ───────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests (domain + contracts + identity)
        run: pnpm test:unit

  # ─── Kit validation (offline reference checks) ────────────────────────
  kit-validation:
    name: Kit Validation (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install jsonschema
        run: pip install jsonschema==4.23.0

      - name: Validate kit contracts and fixtures
        run: python LingoCraft_AI_Implementation_Kit/scripts/validate_kit.py

  # ─── Build check ──────────────────────────────────────────────────────
  build:
    name: Build All Apps
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (domain, contracts, database)
        run: pnpm --filter @lingocraft/domain build
          && pnpm --filter @lingocraft/contracts build
          && pnpm --filter @lingocraft/database build
          && pnpm --filter @lingocraft/identity build

      # Worker build (TypeScript compile check)
      - name: Build worker
        run: pnpm --filter @lingocraft/worker build

      # Web build — validates Next.js compile
      - name: Build web
        run: pnpm --filter @lingocraft/web build

  # ─── Integration Tests (requires secrets) ─────────────────────────────
  # Skipped when DATABASE_URL_APP secret is not configured.
  # Per AGENTS.md rule 10: explicitly documented when not run.
  integration-tests:
    name: Integration Tests (DB)
    runs-on: ubuntu-latest
    needs: build
    # Only run when secret is set (protection: repo admins configure this)
    if: ${{ vars.RUN_INTEGRATION_TESTS == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests (SEC-01, SEC-02)
        env:
          DATABASE_URL_APP: ${{ secrets.DATABASE_URL_APP }}
          DATABASE_URL_MIGRATE: ${{ secrets.DATABASE_URL_MIGRATE }}
        run: pnpm test:integration
